# Render Blueprint — queueQ backend API
# Deploy: https://dashboard.render.com/blueprints → New Blueprint Instance → connect GitHub repo

services:
  - type: web
    name: queueq-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: >-
      cd .. &&
      pnpm install --frozen-lockfile &&
      pnpm --filter backend exec prisma generate &&
      pnpm --filter backend run build
    preDeployCommand: cd .. && pnpm --filter backend exec prisma db push
    startCommand: >-
      pnpm exec prisma db push;
      pnpm exec prisma db execute --file prisma/sync-production.sql --schema prisma/schema.prisma;
      pnpm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: FRONTEND_URL
        value: https://queue-q-frontend.vercel.app,http://localhost:3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
